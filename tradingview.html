<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151e">
  <meta name="description" content="用分頁切換 BTC、ETH、HYPE Binance 永續合約的 TradingView 行情與一日走勢。">
  <title>Crypto Screen · TradingView</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1015; color: #e4e8ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #a8c6ef; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .screen { width: 100%; max-width: 480px; margin: 0 auto; border: 1px solid #29313c; border-radius: 12px; background: #131722; overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 10px; background: #131b27; border-bottom: 1px solid #29313c; }
    .tab { flex: 1; min-width: 0; min-height: 44px; padding: 8px; border: 0; border-radius: 6px; background: transparent; color: #9ba8ba; font-size: 0.875rem; font-weight: 500; }
    .tab:hover { background: #202c3c; }
    .tab[aria-selected="true"] { background: #263448; color: #f0f4fa; }
    .panel { position: relative; height: clamp(360px, calc(100dvh - 112px), 480px); }
    #widget-mount, .tradingview-widget-container { width: 100%; height: 100%; }
    .tradingview-widget-container__widget { width: 100%; height: calc(100% - 32px); }
    .tradingview-widget-copyright { min-height: 32px; padding: 0; font-size: 0.75rem; text-align: center; color: #929bab; }
    .tradingview-widget-copyright a { color: #b3c5ed; text-decoration: none; }
    .tradingview-widget-copyright a:hover { text-decoration: underline; }
    .loading { position: absolute; top: 120px; left: 16px; right: 16px; text-align: center; color: #a5afbd; font-size: 0.875rem; pointer-events: none; }
    .feedback { padding: 12px 16px; border-top: 1px solid #29313c; font-size: 0.875rem; color: #bdc6d2; }
    .feedback p { margin: 0 0 10px; }
    .feedback button { min-height: 44px; padding: 8px 14px; border: 1px solid #3a4658; border-radius: 6px; background: #263448; color: #f0f4fa; }
    @media (max-width: 380px) { body { padding: 8px; } }
  </style>
</head>
<body>
  <main class="screen" aria-label="加密貨幣永續合約行情">
    <nav class="tabs" role="tablist" aria-label="交易對">
      <button type="button" id="tab-btc" class="tab" role="tab" aria-selected="true" aria-controls="chart-panel" tabindex="0" data-symbol="BTC">BTC</button>
      <button type="button" id="tab-eth" class="tab" role="tab" aria-selected="false" aria-controls="chart-panel" tabindex="-1" data-symbol="ETH">ETH</button>
      <button type="button" id="tab-hype" class="tab" role="tab" aria-selected="false" aria-controls="chart-panel" tabindex="-1" data-symbol="HYPE">HYPE</button>
    </nav>
    <section id="chart-panel" class="panel" role="tabpanel" aria-labelledby="tab-btc">
      <div id="widget-mount"></div>
      <div id="loading" class="loading" role="status" aria-live="polite">正在載入 BTC 圖表…</div>
    </section>
    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
      <p id="feedback-text"></p>
      <button type="button" id="retry">重新載入</button>
    </div>
    <noscript><p class="feedback">請啟用 JavaScript，以載入 TradingView 圖表。</p></noscript>
  </main>
  <script>
    (() => {
      'use strict';
      const tabs = Array.from(document.querySelectorAll('.tab'));
      const panel = document.getElementById('chart-panel');
      const mount = document.getElementById('widget-mount');
      const loading = document.getElementById('loading');
      const feedback = document.getElementById('feedback');
      const feedbackText = document.getElementById('feedback-text');
      let selected = 'BTC';
      let cleanup = () => {};

      function loadWidget(symbol) {
        cleanup();
        selected = symbol;
        document.title = symbol + ' · Crypto Screen';
        const active = tabs.find(tab => tab.dataset.symbol === symbol);
        tabs.forEach(tab => {
          const isActive = tab === active;
          tab.setAttribute('aria-selected', String(isActive));
          tab.tabIndex = isActive ? 0 : -1;
        });
        panel.setAttribute('aria-labelledby', active.id);
        panel.setAttribute('aria-busy', 'true');
        loading.textContent = '正在載入 ' + symbol + ' 圖表…';
        loading.hidden = false;
        feedback.hidden = true;

        const container = document.createElement('div');
        container.className = 'tradingview-widget-container';
        const widget = document.createElement('div');
        widget.className = 'tradingview-widget-container__widget';
        const copyright = document.createElement('div');
        copyright.className = 'tradingview-widget-copyright';
        const link = document.createElement('a');
        link.href = 'https://www.tradingview.com/symbols/' + symbol + 'USDT.P/?exchange=BINANCE';
        link.target = '_blank';
        link.rel = 'noopener nofollow';
        const label = document.createElement('span');
        label.className = 'blue-text';
        label.textContent = symbol + ' / USDT';
        link.append(label);
        const trademark = document.createElement('span');
        trademark.className = 'trademark';
        trademark.textContent = ' by TradingView';
        copyright.append(link, trademark);
        container.append(widget, copyright);
        mount.replaceChildren(container);

        let disposed = false, frame = null;
        function showIssue(message) {
          if (disposed) return;
          loading.hidden = true;
          panel.removeAttribute('aria-busy');
          feedbackText.textContent = message;
          feedback.hidden = false;
        }
        function frameLoaded() {
          if (disposed) return;
          clearTimeout(timeout);
          loading.hidden = true;
          feedback.hidden = true;
          panel.removeAttribute('aria-busy');
          // Frame load confirms the embedded page opened, not the freshness of market data.
        }
        const observer = new MutationObserver(() => {
          const inserted = container.querySelector('iframe');
          if (!inserted || frame) return;
          frame = inserted;
          frame.title = symbol + ' / USDT 永續合約 · TradingView';
          frame.addEventListener('load', frameLoaded);
          observer.disconnect();
        });
        observer.observe(container, { childList: true, subtree: true });
        const timeout = setTimeout(() => showIssue('圖表載入較久，請稍候或重新載入。也可點下方 TradingView 連結查看行情。'), 20000);
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js';
        script.async = true;
        script.onerror = () => {
          clearTimeout(timeout);
          showIssue('無法載入 TradingView。請檢查網路或內容封鎖設定，再重新載入。');
        };
        script.textContent = JSON.stringify({
          symbols: [[symbol + ' / USDT 永續合約', 'BINANCE:' + symbol + 'USDT.P|1D']],
          chartOnly: false,
          width: '100%', height: '100%', autosize: true,
          locale: 'zh_TW', colorTheme: 'dark', isTransparent: false,
          backgroundColor: '#131722', widgetFontColor: '#e4e8ef',
          fontColor: '#929bab', gridLineColor: 'rgba(146,155,171,0.10)',
          showVolume: false, showMA: false,
          hideDateRanges: false, hideMarketStatus: true, hideSymbolLogo: true,
          scalePosition: 'right', scaleMode: 'Normal',
          fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif',
          fontSize: '12', headerFontSize: 'medium', noTimeScale: false,
          valuesTracking: '1', changeMode: 'price-and-percent',
          chartType: 'area', lineWidth: 2, lineType: 0,
          lineColor: '#22ab94', topColor: 'rgba(34,171,148,0.16)', bottomColor: 'rgba(34,171,148,0)',
          upColor: '#22ab94', downColor: '#f7525f',
          dateRanges: ['1d|1'], dateFormat: 'MM/dd/yyyy', timeHoursFormat: '24-hours'
        });
        cleanup = () => {
          disposed = true;
          clearTimeout(timeout);
          observer.disconnect();
          if (frame) frame.removeEventListener('load', frameLoaded);
          script.onerror = null;
          mount.replaceChildren();
        };
        container.append(script);
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => {
          if (selected !== tab.dataset.symbol) loadWidget(tab.dataset.symbol);
        });
        tab.addEventListener('keydown', event => {
          let next;
          if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
          if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          if (next === undefined) return;
          event.preventDefault();
          tabs[next].focus();
          if (selected !== tabs[next].dataset.symbol) loadWidget(tabs[next].dataset.symbol);
        });
      });
      document.getElementById('retry').addEventListener('click', () => loadWidget(selected));
      window.addEventListener('pagehide', () => cleanup());
      window.addEventListener('pageshow', event => { if (event.persisted) loadWidget(selected); });
      loadWidget(selected);
    })();
  </script>
</body>
</html>
